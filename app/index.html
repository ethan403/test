<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Download App</title>
</head>
<body>
  <h2>Download App</h2>
  <p id="msg">Checking device...</p>
  <p>
    <a id="iosBtn" href="javascript:void(0)">iOS version coming soon</a><br/>
    <a id="androidBtn" href="https://github.com/ethan403/test/raw/refs/heads/master/app-debug.apk">
      Android Download
    </a>
  </p>

  <script>
    const ANDROID_URL = "https://github.com/ethan403/test/raw/refs/heads/master/app-debug.apk";

    const ua = navigator.userAgent || "";
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);

    if (isIOS) {
      // iOS 不自動跳轉
      document.getElementById("msg").textContent = "iOS version coming soon";
    } else if (isAndroid) {
      // Android 自動下載
      document.getElementById("msg").textContent = "Downloading Android APK...";
      location.replace(ANDROID_URL);
    } else {
      document.getElementById("msg").textContent = "Choose your platform:";
    }
  </script>
</body>
</html>
